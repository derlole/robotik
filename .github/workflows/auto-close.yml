name: Move overdue issues to Done

on:
  schedule:
    - cron: "0 0 * * *" # täglich um Mitternacht UTC
  workflow_dispatch: # optional: manuell starten

jobs:
  update-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Update overdue issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const script = require('${{ github.workspace }}/.github/scripts/auto-close.js');
            await script({ github, context });
